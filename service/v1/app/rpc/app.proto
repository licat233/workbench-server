syntax = "proto3";

package app;

option go_package = "./app";

message PowerAuthRequest {
  int64 sub = 1;
  int64 dom = 2;
  string obj = 3;
  string act = 4;
}

message PowerAuthResponse {
  bool ok = 1;
}

service app {
  //RBAC身份权限验证
  rpc PowerAuth(PowerAuthRequest) returns(PowerAuthResponse);
}
